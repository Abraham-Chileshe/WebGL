<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="description" content="CS4406 Computer Graphics" />
  <meta charset="utf-8" />
  <title>Computer Graphics</title>
  
  <style>
    #container {
      background: #000000;
      width: 100%;
      height: 100%;
    }
  </style>
  
  <meta charset="utf-8" />
  <style id="jsbin-css"></style>
</head>
<body>
  <div id="container"></div>

  <!-- Include necessary libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/85/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.6.5/dat.gui.min.js"></script>
  <script src="https://cdn.rawgit.com/mrdoob/three.js/master/examples/js/controls/OrbitControls.js"></script>
  <script src="http://uopeopleweb.com/js/math.js"></script>
  <script src="https://cdn.rawgit.com/mrdoob/three.js/master/examples/js/Detector.js"></script>

  <script type="text/javascript">
    // Set the scene size
    var width = 600, height = 500;

    // Declare variables for the renderer, scene, camera, light, and other objects
    var renderer, scene, light, camera, cameraControls, loader;
    var geometry, mesh, group, earthTexture, moonTexture;

    // Initialize the scene
    init();

    // Start the animation and rendering
    animate();
    render();

    // Function to set up the renderer, scene, camera, light, and objects
    function init() {
      // Create the renderer and enable shadow mapping
      renderer = new THREE.WebGLRenderer();
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.setSize(width, height);
      document.body.appendChild(renderer.domElement);

      // Create a new scene
      scene = new THREE.Scene();

      // Set up the camera with perspective projection
      camera = new THREE.PerspectiveCamera(70, width / height, 1, 1000);
      camera.position.z = 500; // Move the camera back so we can see the objects
      scene.add(camera);

      // Add directional light to simulate sunlight
      light = new THREE.DirectionalLight('white', 1.3);
      light.castShadow = true;
      light.position.set(2, 1, 1); // Position light to the right of the planet
      scene.add(light);

      // Load the Earth and Moon textures
      loader = new THREE.TextureLoader();
      loader.crossOrigin = '';

      // Earth texture
      earthTexture = loader.load('https://s3-us-west-2.amazonaws.com/s.cdpn.io/141228/earthmap1k.jpg');

      // Moon texture
      moonTexture = loader.load('https://s3-us-west-2.amazonaws.com/s.cdpn.io/409445/moon_texture_2.jpg');

      // Create Earth object using a sphere geometry and texture material
      var material = [new THREE.MeshLambertMaterial({ map: earthTexture })];
      geometry = new THREE.SphereGeometry(100, 30, 30);
      mesh = new THREE.Mesh(geometry, material);
      mesh.receiveShadow = true;
      mesh.castShadow = true;

      // Create Moon object with a smaller sphere geometry and moon texture
      var material2 = [new THREE.MeshLambertMaterial({ map: moonTexture })];
      geometry2 = new THREE.SphereGeometry(30, 30, 30);
      mesh2 = new THREE.Mesh(geometry2, material2);
      mesh2.receiveShadow = true;
      mesh2.castShadow = true;
      mesh2.position.set(200, 50, 0); // Move the Moon to the side of the Earth

      // Group Earth and Moon together
      group = new THREE.Group();
      group.add(mesh);
      group.add(mesh2);
      scene.add(group);
    }

    // Animation loop to render the scene continuously
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }

    // Render function to apply rotation and update the scene
    function render() {
      // Rotate the Earth and Moon on their Y-axis
      mesh.rotation.y -= 0.007;
      mesh2.rotation.y -= 0.005;

      // Slowly rotate the entire group (Earth and Moon)
      group.rotation.y += 0.003;

      // Render the scene from the perspective of the camera
      renderer.render(scene, camera);
      requestAnimationFrame(render); // Continuously call render function
    }
  </script>
</body>
</html>
