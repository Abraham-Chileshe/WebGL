<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>CS4406 Computer Graphics - Programming Assignment #2</title>
    <style>
        /* Define the container dimensions to fill the entire viewport */
        #container {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Container where the WebGL content will be rendered -->
    <div id="container"></div>

    <!-- Importing Three.js library for 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/94/three.min.js"></script>

    <script>
        // Set the scene size based on the browser window dimensions
        var WIDTH = window.innerWidth;
        var HEIGHT = window.innerHeight;

        // Define camera attributes
        var VIEW_ANGLE = 45;      // Field of view in degrees
        var ASPECT = WIDTH / HEIGHT;  // Aspect ratio based on window size
        var NEAR = 0.1;           // Nearest rendering distance
        var FAR = 1000;           // Farthest rendering distance

        // Retrieve the container element where the scene will be rendered
        var container = document.getElementById('container');

        // Create a WebGL renderer
        var renderer = new THREE.WebGLRenderer();
        
        // Set the size of the renderer to match the window size
        renderer.setSize(WIDTH, HEIGHT);
        
        // Append the renderer's output (a <canvas> element) to the container
        container.appendChild(renderer.domElement);

        // Create a perspective camera with specified attributes
        var camera = new THREE.PerspectiveCamera(VIEW_ANGLE, ASPECT, NEAR, FAR);

        // Set initial camera position along the z-axis so objects are visible
        camera.position.z = 5;

        // Create a new scene that will hold all the 3D objects, lights, etc.
        var scene = new THREE.Scene();

        // Add the camera to the scene
        scene.add(camera);

        // Create geometry for a pyramid-like structure using custom vertices
        var geometry = new THREE.Geometry();
        
        // Define the vertices of the pyramid
        geometry.vertices.push(new THREE.Vector3(1, 1, 0));    // Vertex 0
        geometry.vertices.push(new THREE.Vector3(-1, 1, 0));   // Vertex 1
        geometry.vertices.push(new THREE.Vector3(-1, -1, 0));  // Vertex 2
        geometry.vertices.push(new THREE.Vector3(1, -1, 0));   // Vertex 3
        geometry.vertices.push(new THREE.Vector3(0, 0, 1));    // Vertex 4 (top point of the pyramid)

        // Define the triangular faces of the pyramid using vertices
        geometry.faces.push(new THREE.Face3(0, 1, 2));   // Base face
        geometry.faces.push(new THREE.Face3(0, 2, 3));   // Base face
        geometry.faces.push(new THREE.Face3(0, 3, 4));   // Side face
        geometry.faces.push(new THREE.Face3(0, 4, 1));   // Side face
        geometry.faces.push(new THREE.Face3(1, 4, 2));   // Side face
        geometry.faces.push(new THREE.Face3(2, 4, 3));   // Side face

        // Create a material for the pyramid with red color and flat shading
        var material = new THREE.MeshPhongMaterial({
            color: 0xff0000,      // Red color
            flatShading: true     // Enable flat shading for a polygonal look
        });

        // Create a mesh object by combining the geometry and material
        var mesh = new THREE.Mesh(geometry, material);
        
        // Add the mesh (pyramid) to the scene
        scene.add(mesh);

        // Create a point light to illuminate the object, and set its position
        var light = new THREE.PointLight(0xffffff);  // White light
        light.position.set(10, 10, 10);  // Light position in the scene
        scene.add(light);  // Add the light to the scene

        // Function to animate the scene and render it continuously
        function animate() {
            // Request the browser to call this function before the next repaint
            requestAnimationFrame(animate);
            
            // Incrementally rotate the mesh on the x and y axes
            mesh.rotation.x += 0.01;  // Rotate by 0.01 radians each frame
            mesh.rotation.y += 0.01;  // Rotate by 0.01 radians each frame
            
            // Render the scene from the perspective of the camera
            renderer.render(scene, camera);
        }

        // Call the animate function for the first time to start the loop
        animate();

        // Handle window resizing to update the renderer and camera accordingly
        window.addEventListener('resize', function() {
            // Update the width and height to the new window size
            WIDTH = window.innerWidth;
            HEIGHT = window.innerHeight;
            
            // Update the aspect ratio of the camera
            camera.aspect = WIDTH / HEIGHT;
            camera.updateProjectionMatrix();
            
            // Update the size of the renderer
            renderer.setSize(WIDTH, HEIGHT);
        });

    </script>
</body>
</html>
